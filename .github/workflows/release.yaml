name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Elka" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "elka.exe" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel windows-stable \
            --icon "build/windows/icon.ico" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Elka" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "elka" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel linux-stable \
            --icon "build/appicon.png" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task package
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          APP_BUNDLE=$(find bin -maxdepth 1 -name "*.app" | head -n 1)
          
          vpk pack \
            --packId "Elka" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "$APP_BUNDLE" \
            --mainExe "elka" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel macos-stable \
            --runtime osx-arm64 \
            --icon "build/darwin/icons.icns" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"
